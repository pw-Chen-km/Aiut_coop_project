[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qegs"
version = "0.1.0"
description = "Adaptive corpus-to-skill navigation, scoped dense RAG and joint SkillOPT research tooling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5"]
test = ["pytest>=8", "scikit-learn>=1.8"]
doc2skill = ["docling>=2", "numpy>=1.26", "transformers>=4.51", "torch>=2.6", "jsonschema>=4.23"]
qa = ["numpy>=1.26", "transformers>=4.51", "torch>=2.6", "jsonschema>=4.23"]
native = ["docling-core[chunking]==2.94.1", "numpy>=1.26", "transformers>=4.51", "torch>=2.6", "jsonschema>=4.23"]
comparison = ["docling==2.125.0", "docling-core[chunking]==2.94.1", "numpy>=1.26", "scikit-learn>=1.8", "transformers>=5.6", "torch>=2.6", "jsonschema>=4.23", "pypdf>=5", "gguf==0.19.0"]
skillopt = ["openai>=1.30", "pyyaml>=6", "numpy>=1.26", "openpyxl>=3.1", "azure-identity>=1.15", "azure-core>=1.30", "httpx>=0.27"]

[project.scripts]
qegs = "qegs.cli:main"
qegs-evaluate-answers = "evaluation.evaluate_answers:main"
doc2skill = "doc2skill.cli:main"
qa-agent = "qa_agent.cli:main"
qa-skillopt = "qa_skillopt.cli:main"
qa-experiments = "qa_experiments.cli:main"
qa-benchmarks = "qa_benchmarks.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qa_agent = ["prompts/*.md"]
"doc2skill._vendor.corpus2skill" = ["LICENSE", "UPSTREAM.md", "clustering.upstream.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
