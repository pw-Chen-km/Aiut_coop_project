[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qursor-llm-rag"
version = "0.1.0"
description = "CPU-first evidence-grounded Qursor RAG service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "transformers>=4.51,<5",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
offline = [
  "docling>=2",
  "docling-core[chunking]==2.94.1",
  "pypdfium2>=4.30,<5",
]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "unittest-xml-reporting==3.2.0"]

[project.scripts]
qursor-api = "qursor_enterprise_qa.http_api.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
