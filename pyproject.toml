[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-aware-rag-benchmark"
version = "0.1.0"
description = "Standalone topic-aware retrieval experiments; no production service dependency"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "httpx>=0.27,<1", "PyYAML>=6,<7", "tokenizers>=0.21,<1"]

[project.optional-dependencies]
prepare = ["pyarrow>=19,<24"]
embedding = ["torch>=2.6,<3", "transformers>=4.51,<6"]
test = ["pytest>=8,<10", "ruff==0.13.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

